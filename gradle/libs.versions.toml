[versions]
compileSdk = "35"
minSdk = "21"

agp = "8.2.0"
androidx-test-junit = "1.2.1"
byteBuddy = "1.14.10"
detekt = "1.23.8"
junit = "4.13.2"
kotlin = "1.9.20"
runner = "1.6.1"
firebase = "29.2.1"
agpVersion = "8.7.3"
coreKtx = "1.16.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
integrity = "1.0.1"

[plugins]
android-library = { id = "com.android.library" }
kotlin-android = { id = "org.jetbrains.kotlin.android" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint" }
maven-publish = { id = "maven-publish" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
android-application = { id = "com.android.application", version.ref = "agpVersion" }

[libraries]
androidx-test-runner = { module = "androidx.test:runner", version.ref = "runner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }

bytebuddy = { module = "net.bytebuddy:byte-buddy", version.ref = "byteBuddy" }
bytebuddy-android = { module = "net.bytebuddy:byte-buddy-android", version.ref = "byteBuddy" }
integrations-applovin = { group = "com.applovin", name = "applovin-sdk", version = "13.2.0" }
integrations-applovin-legacy = { group = "com.applovin", name = "applovin-sdk", version = "12.6.0" }
integrations-chartboost = { group = "com.chartboost", name = "chartboost-sdk", version = "9.2.0" }
integrations-ironsource = { group = "com.unity3d.ads-mediation", name = "mediation-sdk", version = "8.11.0" }
integrations-ironsource-legacy = { group = "com.ironsource.sdk", name = "mediationsdk", version = "8.7.0" }
integrations-ironsource-adquality = { group = "com.unity3d.ads-mediation", name = "adquality-sdk", version = "7.26.2" }
integrations-ironsource-adquality-legacy = { group = "com.ironsource", name = "adqualitysdk", version = "7.23.3" }

integrations-unityads = { group = "com.unity3d.ads", name = "unity-ads", version = "4.16.5" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics", version = "" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
justtrack-integrity = { module = "io.justtrack:integrity", version.ref = "integrity" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
