[versions]
compileSdk = "35"
minSdk = "21"

agp = "8.2.0"
androidx-test-junit = "1.3.0"
byteBuddy = "1.14.10"
detekt = "1.23.8"
junit = "4.13.2"
kotlin = "1.9.20"
orchestrator = "1.6.1"
runner = "1.7.0"
firebase = "29.2.1"
agpVersion = "8.13.2"
coreKtx = "1.16.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
integrity = "1.0.1"
dokka = "2.0.0"
ktlint = "12.3.0"
googleServices = "4.4.2"
testServices = "1.6.0"

[plugins]
android-library = { id = "com.android.library", version.ref = "agpVersion" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
maven-publish = { id = "maven-publish" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
android-application = { id = "com.android.application", version.ref = "agpVersion" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
jacoco = { id = "jacoco" }
checkstyle = { id = "checkstyle" }

[libraries]
androidx-core = { module = "androidx.test:core", version.ref = "runner" }
androidx-orchestrator = { module = "androidx.test:orchestrator", version.ref = "orchestrator" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "runner" }
