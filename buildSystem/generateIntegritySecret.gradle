project.ext.generateIntegritySecret = (Project project, def variant) -> {
    def localProperties = project.rootProject.ext.loadRequiredLocalProperties(project.rootProject.rootDir)
    def secretValueFirst = localProperties.getProperty('integritySecretKeyFirst', "")
    def secretValueSecond = localProperties.getProperty('integritySecretKeySecond', "")

    def outputDir = project.file("${project.buildDir}/generated/source/integritySecret/${variant.dirName}")
    def outputFile = project.file("${outputDir}/io/justtrack/IntegritySecret.kt")
    def outputKeyFile = project.file("${outputDir}/io/justtrack/IntegrityKey.kt")

    def generateTask = project.tasks.register("generate${variant.name.capitalize()}IntegritySecret") {
        outputs.files(outputFile, outputKeyFile)
        inputs.property("integritySecretKeyFirst", secretValueFirst)
        inputs.property("integritySecretKeySecond", secretValueSecond)
        doLast {
            outputDir.mkdirs()
            if (secretValueFirst.trim().isEmpty() || secretValueSecond.trim().isEmpty()) {
                return
            }
            outputFile.text = """package io.justtrack

const val integritySecretKeyFirst = \"${secretValueFirst}\"
"""
            outputKeyFile.text = """package io.justtrack

const val integritySecretKeySecond = \"${secretValueSecond}\"
"""
        }
    }

    variant.registerJavaGeneratingTask(generateTask, outputDir)
}
